<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Attributes Example</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      padding:30px;
    }

    .box{
      background:#1e293b;
      padding:20px;
      margin-bottom:20px;
      border-radius:10px;
    }

    h1{
      color:#38bdf8;
    }

    button{
      padding:10px 15px;
      border:none;
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
      border-radius:5px;
    }
  </style>
</head>

<body>

  <h1 id="main-title"
      class="box"
      title="Main Heading"
      lang="en"
      dir="ltr"
      tabindex="1"
      contenteditable="true"
      draggable="true"
      spellcheck="true"
      hidden="false">
      HTML Global Attributes
  </h1>

  <p id="paragraph1"
     class="box"
     title="Paragraph Example"
     lang="en"
     dir="ltr"
     tabindex="2"
     contenteditable="true"
     draggable="true"
     spellcheck="true">
     This paragraph contains many global attributes.
  </p>

  <div id="container"
       class="box"
       title="Container Div"
       data-user="anbiya"
       data-role="developer"
       tabindex="3">

      <h2>About Web Development</h2>

      <p>
        HTML provides structure for websites while CSS styles them beautifully.
      </p>

  </div>

  <img src="https://via.placeholder.com/200"
       alt="Sample Image"
       id="image1"
       class="box"
       title="Placeholder Image"
       draggable="true"
       tabindex="4">

  <a href="https://www.google.com"
     id="link1"
     class="box"
     title="Google Link"
     target="_blank"
     tabindex="5">
     Visit Google
  </a>

  <button id="btn"
          class="box"
          title="Submit Button"
          tabindex="6"
          accesskey="b">
          Click Me
  </button>

  <form class="box"
        id="form1"
        autocomplete="on"
        tabindex="7">

      <label for="name">Name:</label>
      <input type="text"
             id="name"
             name="name"
             placeholder="Enter name"
             required
             tabindex="8">

      <br><br>

      <label for="email">Email:</label>
      <input type="email"
             id="email"
             name="email"
             placeholder="Enter email"
             required
             tabindex="9">

      <br><br>

      <button type="submit">Submit</button>

  </form>

  <section id="section1"
           class="box"
           title="Semantic Section"
           tabindex="10">

      <h2>Semantic HTML</h2>

      <article>
        <h3>Article Title</h3>
        <p>This article demonstrates semantic elements.</p>
      </article>

  </section>

  <footer id="footer"
          class="box"
          title="Footer Area"
          tabindex="11">

      <p>&copy; 2026 Global Attributes Demo</p>

  </footer>

</body>
</html>
